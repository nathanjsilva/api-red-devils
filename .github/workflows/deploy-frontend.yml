name: Deploy frontend

on:
  workflow_dispatch:
    inputs:
      frontend_dir:
        description: 'Caminho da pasta do frontend na VPS (opcional; será detectado automaticamente)'
        required: false
        type: string

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Pull, build and restart frontend on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script_stop: true
          script: |
            set -eu
            echo "Iniciando deploy do frontend..."

            API_DIR="${{ secrets.VPS_APP_DIR }}"
            echo "Conexao e variaveis iniciais OK"
            REQUESTED_FRONTEND_DIR="${{ inputs.frontend_dir }}"
            FRONTEND_DIR="$REQUESTED_FRONTEND_DIR"

            if [ -n "$FRONTEND_DIR" ]; then
              if [ ! -d "$FRONTEND_DIR/.git" ]; then
                echo "Diretorio informado nao contem repositorio Git: $FRONTEND_DIR"
                exit 1
              fi
            else
              API_PARENT="${API_DIR%/*}"
              echo "Diretorio pai da API identificado"
              for candidate in \
                "$API_PARENT/app-red-devils" \
                "/var/www/app-red-devils" \
                "/opt/app-red-devils"; do
                if [ -d "$candidate/.git" ]; then
                  FRONTEND_DIR="$candidate"
                  echo "Repositorio encontrado em candidato"
                  break
                fi
              done
            fi

            if [ -z "$FRONTEND_DIR" ]; then
              echo "Repositorio app-red-devils nao encontrado na VPS."
              echo "Informe o caminho usando o input frontend_dir ao executar este workflow."
              exit 1
            fi

            echo "Frontend encontrado em: $FRONTEND_DIR"
            git -C "$FRONTEND_DIR" fetch origin master
            git -C "$FRONTEND_DIR" checkout master
            git -C "$FRONTEND_DIR" pull --ff-only origin master

            cd "$FRONTEND_DIR"
            command -v npm >/dev/null 2>&1 || { echo "npm nao encontrado na VPS."; exit 1; }
            npm ci
            npm run build

            if docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            elif docker-compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker-compose"
            else
              echo "Docker Compose nao encontrado na VPS."
              exit 1
            fi

            $COMPOSE_CMD -f docker-compose.prod.yml up -d --force-recreate --remove-orphans web
            $COMPOSE_CMD -f docker-compose.prod.yml ps
            echo "Deploy do frontend concluido com sucesso."

name: Check production web

on:
  workflow_dispatch:
    inputs:
      unstart_championship_id:
        description: Championship ID to return to setup without deleting records
        required: false
        type: string

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check frontend container and local port
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script_stop: true
          script: |
            docker inspect app_red_devils_web --format 'container={{.Name}} status={{.State.Status}} running={{.State.Running}} exit={{.State.ExitCode}}' || true
            curl -sS -o /dev/null -w 'local-8080-http=%{http_code}\n' --max-time 10 http://127.0.0.1:8080/ || true
            docker inspect api_red_devils_nginx --format 'container={{.Name}} status={{.State.Status}} running={{.State.Running}} exit={{.State.ExitCode}}' || true
            API_STATUS="$(curl -sS -H 'Accept: application/json' -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:8081/api/admin/me)"
            echo "local-8081-http=$API_STATUS"
            if [ "$API_STATUS" = "500" ]; then
              LAST_EXCEPTION="$(docker exec api_red_devils_app sh -lc "grep -h 'production.ERROR:' storage/logs/laravel*.log 2>/dev/null | tail -n 1 | grep -oE '[A-Za-z0-9_]+(Exception|Error)' | tail -n 1 | head -c 120" || true)"
              echo "api-last-exception=${LAST_EXCEPTION:-unavailable}"
              exit 1
            fi
            if [ "$API_STATUS" != "200" ] && [ "$API_STATUS" != "401" ]; then
              echo "Resposta inesperada da API: $API_STATUS"
              exit 1
            fi

      - name: Return production championship to setup when requested
        if: ${{ inputs.unstart_championship_id != '' }}
        uses: appleboy/ssh-action@v1.2.0
        env:
          CHAMPIONSHIP_ID: ${{ inputs.unstart_championship_id }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          envs: CHAMPIONSHIP_ID
          script_stop: true
          script: |
            docker exec -i -e CHAMPIONSHIP_ID="$CHAMPIONSHIP_ID" api_red_devils_app php <<'PHP'
            <?php
            require "vendor/autoload.php";
            $app = require "bootstrap/app.php";
            $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            $id = filter_var(getenv("CHAMPIONSHIP_ID"), FILTER_VALIDATE_INT);
            if (!$id) {
                throw new RuntimeException("ID invalido");
            }

            $result = \Illuminate\Support\Facades\DB::transaction(function () use ($id) {
                $championship = \Illuminate\Support\Facades\DB::table("championships")
                    ->where("id", $id)
                    ->lockForUpdate()
                    ->first();
                if (!$championship) {
                    throw new RuntimeException("Campeonato nao encontrado");
                }
                if ($championship->status === "draft" && $championship->phase === "setup") {
                    return "already-in-setup";
                }
                if ($championship->status !== "active" || $championship->phase !== "group") {
                    throw new RuntimeException("Estado atual nao permite retorno seguro ao setup");
                }

                $matches = \Illuminate\Support\Facades\DB::table("championship_matches")
                    ->where("championship_id", $id)
                    ->lockForUpdate()
                    ->get(["id", "status", "home_score", "away_score", "home_penalty_score", "away_penalty_score", "qualified_team_id"]);
                if ($matches->isEmpty()) {
                    throw new RuntimeException("Nenhuma partida encontrada; estado nao alterado");
                }
                foreach ($matches as $match) {
                    if ($match->status !== "scheduled" || $match->home_score !== null || $match->away_score !== null || $match->home_penalty_score !== null || $match->away_penalty_score !== null || $match->qualified_team_id !== null) {
                        throw new RuntimeException("Ha partidas iniciadas ou com resultado; estado nao alterado");
                    }
                }

                $matchIds = $matches->pluck("id");
                foreach (["championship_match_events", "championship_match_participations", "championship_odds"] as $table) {
                    if (\Illuminate\Support\Facades\DB::table($table)->whereIn("match_id", $matchIds)->exists()) {
                        throw new RuntimeException("Ha dados de jogo registrados; estado nao alterado");
                    }
                }

                \Illuminate\Support\Facades\DB::table("championships")
                    ->where("id", $id)
                    ->update(["status" => "draft", "phase" => "setup", "updated_at" => now()]);
                return "returned-to-setup";
            });

            $championship = \Illuminate\Support\Facades\DB::table("championships")->where("id", $id)->first();
            $matchesCount = \Illuminate\Support\Facades\DB::table("championship_matches")->where("championship_id", $id)->count();
            $teamsCount = \Illuminate\Support\Facades\DB::table("championship_teams")->where("championship_id", $id)->count();
            $playersCount = \Illuminate\Support\Facades\DB::table("championship_players")->where("championship_id", $id)->count();
            $votersCount = \Illuminate\Support\Facades\DB::table("championship_voters")->where("championship_id", $id)->count();
            echo "production-championship=" . $id . " " . $championship->status . " " . $championship->phase . " matches=" . $matchesCount . " teams=" . $teamsCount . " players=" . $playersCount . " voters=" . $votersCount . " operation=" . $result . PHP_EOL;
            if ($championship->status !== "draft" || $championship->phase !== "setup") {
                throw new RuntimeException("Verificacao final falhou");
            }
            PHP

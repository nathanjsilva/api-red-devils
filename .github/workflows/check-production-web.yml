name: Check production web

on:
  workflow_dispatch:
    inputs:
      unstart_championship_id:
        description: Championship ID to return to setup without deleting records
        required: false
        type: string

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check frontend container and local port
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script_stop: true
          script: |
            docker inspect app_red_devils_web --format 'container={{.Name}} status={{.State.Status}} running={{.State.Running}} exit={{.State.ExitCode}}' || true
            curl -sS -o /dev/null -w 'local-8080-http=%{http_code}\n' --max-time 10 http://127.0.0.1:8080/ || true
            docker inspect api_red_devils_nginx --format 'container={{.Name}} status={{.State.Status}} running={{.State.Running}} exit={{.State.ExitCode}}' || true
            API_STATUS="$(curl -sS -H 'Accept: application/json' -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:8081/api/admin/me)"
            echo "local-8081-http=$API_STATUS"
            if [ "$API_STATUS" = "500" ]; then
              LAST_EXCEPTION="$(docker exec api_red_devils_app sh -lc "grep -h 'production.ERROR:' storage/logs/laravel*.log 2>/dev/null | tail -n 1 | grep -oE '[A-Za-z0-9_]+(Exception|Error)' | tail -n 1 | head -c 120" || true)"
              echo "api-last-exception=${LAST_EXCEPTION:-unavailable}"
              exit 1
            fi
            if [ "$API_STATUS" != "200" ] && [ "$API_STATUS" != "401" ]; then
              echo "Resposta inesperada da API: $API_STATUS"
              exit 1
            fi

      - name: Return production championship to setup when requested
        if: ${{ inputs.unstart_championship_id != '' }}
        uses: appleboy/ssh-action@v1.2.0
        env:
          CHAMPIONSHIP_ID: ${{ inputs.unstart_championship_id }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          envs: CHAMPIONSHIP_ID
          script_stop: true
          script: |
            docker exec -e CHAMPIONSHIP_ID="$CHAMPIONSHIP_ID" api_red_devils_app php -r "eval(base64_decode(''));"


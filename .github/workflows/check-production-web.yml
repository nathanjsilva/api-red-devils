name: Check production web

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check frontend container and local port
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script_stop: true
          script: |
            docker inspect app_red_devils_web --format 'container={{.Name}} status={{.State.Status}} running={{.State.Running}} exit={{.State.ExitCode}}' || true
            curl -sS -o /dev/null -w 'local-8080-http=%{http_code}\n' --max-time 10 http://127.0.0.1:8080/ || true
            docker inspect api_red_devils_nginx --format 'container={{.Name}} status={{.State.Status}} running={{.State.Running}} exit={{.State.ExitCode}}' || true
            API_STATUS="$(curl -sS -H 'Accept: application/json' -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:8081/api/admin/me)"
            echo "local-8081-http=$API_STATUS"
            if [ "$API_STATUS" = "500" ]; then
              LAST_EXCEPTION="$(docker exec api_red_devils_app sh -lc "grep -h 'production.ERROR:' storage/logs/laravel*.log 2>/dev/null | tail -n 1 | grep -oE '[A-Za-z0-9_]+(Exception|Error)' | tail -n 1 | head -c 120" || true)"
              echo "api-last-exception=${LAST_EXCEPTION:-unavailable}"
              exit 1
            fi
            if [ "$API_STATUS" != "200" ] && [ "$API_STATUS" != "401" ]; then
              echo "Resposta inesperada da API: $API_STATUS"
              exit 1
            fi
            docker exec api_red_devils_mysql sh -lc 'mysql -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" --batch --skip-column-names -e "SELECT c.id, c.status, c.phase, (SELECT COUNT(*) FROM championship_matches m WHERE m.championship_id = c.id) AS matches, (SELECT COUNT(*) FROM championship_matches m WHERE m.championship_id = c.id AND (m.home_score IS NOT NULL OR m.away_score IS NOT NULL)) AS scored_matches, (SELECT COUNT(*) FROM championship_match_events e JOIN championship_matches m ON m.id = e.match_id WHERE m.championship_id = c.id) AS events, (SELECT COUNT(*) FROM championship_match_participations p JOIN championship_matches m ON m.id = p.match_id WHERE m.championship_id = c.id) AS participations, (SELECT COUNT(*) FROM championship_odds o JOIN championship_matches m ON m.id = o.match_id WHERE m.championship_id = c.id) AS odds, (SELECT COUNT(*) FROM championship_teams t WHERE t.championship_id = c.id) AS teams, (SELECT COUNT(*) FROM championship_players cp WHERE cp.championship_id = c.id) AS players, (SELECT COUNT(*) FROM championship_voters v WHERE v.championship_id = c.id) AS voters FROM championships c ORDER BY c.id"' | while IFS= read -r row; do echo "production-championship=$row"; done

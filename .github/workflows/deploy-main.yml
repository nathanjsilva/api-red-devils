name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      unstart_championship_id:
        description: Championship ID to return to setup while preserving records
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -Eeuo pipefail
            APP_DIR="${{ secrets.VPS_APP_DIR }}"

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Diretorio da aplicacao nao contem repositorio Git: $APP_DIR"
              exit 1
            fi

            cd "$APP_DIR"

            restore_runtime_permissions() {
              local gitignore_file

              while IFS= read -r -d '' gitignore_file; do
                if [ "$(id -u)" -eq 0 ]; then
                  chown "$(id -u):$(id -g)" "$gitignore_file" "$(dirname "$gitignore_file")"
                elif sudo -n true >/dev/null 2>&1; then
                  sudo -n chown "$(id -u):$(id -g)" "$gitignore_file" "$(dirname "$gitignore_file")"
                else
                  echo "Nao foi possivel obter permissao para preparar storage e bootstrap/cache."
                  return 1
                fi
              done < <(find "$APP_DIR/storage" "$APP_DIR/bootstrap/cache" -type f -name .gitignore -print0)
            }

            restore_runtime_permissions
            trap 'restore_runtime_permissions || true' EXIT
            chmod +x deploy.sh
            APP_BRANCH=main ./deploy.sh

      - name: Return production championship to setup when requested
        if: ${{ inputs.unstart_championship_id != '' }}
        uses: appleboy/ssh-action@v1.2.0
        env:
          CHAMPIONSHIP_ID: ${{ inputs.unstart_championship_id }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          envs: CHAMPIONSHIP_ID
          command_timeout: 10m
          script_stop: true
          script: |
            docker exec -e CHAMPIONSHIP_ID="$CHAMPIONSHIP_ID" api_red_devils_app php -r "eval(base64_decode(''));"
